# Sharp server API endpoint.
server: "http://localhost:8000"

# Shared environment variables merged into every worker.
common_env:
  # P1-3 real token metering (default OFF). Set to "1" to make every claude
  # invocation inject --output-format json; the dispatcher then records the
  # token usage (input/output/cache + total_cost_usd) best-effort into the
  # task_usage table. Requires a claude CLI version that supports the flag.
  # NOTE: read once at dispatcher start; changing it requires a restart.
  # SHARP_TOKEN_METERING: "1"
  # Android dynamic testing (frida / panda-dex-dumper):
  # The worker container cannot see USB devices. This variable tells adb inside
  # the container to connect to the HOST's adb server over TCP instead.
  # Requires: run `adb server` on the host (macOS/Windows: starts automatically
  # when you run any adb command with the phone USB-connected).
  # Remove or comment this line if you only do static analysis and don't need a
  # device — an empty value breaks adb, so it must be absent, not empty.
  ADB_SERVER_SOCKET: "tcp:host.docker.internal:5037"
  # Wireless alternative (no config needed here): inside the container run:
  #   adb connect <phone-ip>:<port>   (phone: enable Wireless Debugging in DevOps)

runtime:
  # Scheduler tick interval in seconds.
  interval: 3
  # Global concurrency cap across all workers and all projects.
  max_workers: 8
  # Maximum number of projects that may be actively scheduled at the same time.
  max_running_projects: 3
  # Per-project worker cap. Prevents one project from monopolizing the whole dispatcher.
  max_project_workers: 4
  # Healthcheck timeout for each worker process before a task is assigned.
  # Bumped to 60s: third-party API gateways/proxies can take 7-20s to answer even a minimal ping,
  # and a too-tight timeout falsely marks the worker unhealthy, causing the
  # dispatch->healthcheck-timeout->cooldown->retry loop.
  healthcheck_timeout: 60
  # Prompt set loaded from runtime/src/sharp/dispatcher/prompts/.
  prompt_group: "default"
  # P0-2 bootstrap stall protection. 0 = disabled (legacy: a project whose
  # bootstrap keeps failing stays in its initial state and is re-dispatched
  # forever). When > 0, after that many consecutive failed bootstrap outcomes
  # the dispatcher writes a diagnostic hint and pauses bootstrap dispatch until
  # the operator adds a hint. NOTE: this file is read once at dispatcher start;
  # changing it requires restarting the dispatcher.
  bootstrap_stall_threshold: 0
  # P0-1 attack-chain dependency gate. false = disabled (legacy behavior:
  # intents dispatch regardless of their depends_on). When true, an intent
  # whose depends_on facts are not all present is held back until its
  # predecessor's evidence lands — reason may declare whole chains at once.
  # NOTE: this file is read once at dispatcher start; changing it requires
  # restarting the dispatcher.
  intent_dependency_gate: false
  # P1-4 worker process-level exchange. false = disabled (legacy behavior:
  # task rounds leave no trace; reason cannot see past failures). When true,
  # the dispatcher archives one task_traces row per round at reap time and
  # reason injects the recent traces into its prompt — dead directions and
  # repeated timeouts become visible across rounds. NOTE: this file is read
  # once at dispatcher start; changing it requires restarting the dispatcher.
  task_trace_archive: false
  # P1-2 deterministic prescan. false = disabled (legacy behavior: the
  # bootstrap LLM re-does HTTP/port/URL recon by hand, burning tokens on
  # deterministic work). When true, an initial-state project runs
  # httpx/nmap/katana ONCE against its origin host (scope hard-gated: no
  # subdomain/CIDR/wildcard expansion) and seeds a fact before bootstrap.
  # Tools must exist inside the worker container; missing tools are skipped.
  # NOTE: this file is read once at dispatcher start; changing it requires a
  # restart of the dispatcher.
  prescan_enabled: false
  # P1-1 evidence auto-bind. false = disabled (legacy behavior: a finding's
  # `evidence` is whatever the model wrote, often blank). When true, each task
  # buffers its live output and a finding without evidence gets it auto-filled
  # from the observed output for that URL. Task-local only — no proxy, no
  # TLS/JA3 impact. NOTE: read once at dispatcher start; restart to change.
  evidence_auto_bind: false
  # P2 context graph-distance compression. false = disabled (legacy time-based
  # truncation). When true, the graph YAML handed to reason/explore compresses
  # facts by structural distance from the focus node (reason: goal; explore:
  # the intent's from facts) instead of recency. NOTE: restart to change.
  graph_distance_context: false
  # P2 fact time ordering. false = disabled (legacy: the time-based summarizer
  # picks "most recent" by list order). When true it ranks by the facts'
  # first-hand created_at timestamps. NOTE: restart to change.
  fact_time_ordering: false
  # P2 task-type env overrides (model split). Empty = disabled (legacy: every
  # task type runs the worker's model). Maps task type -> env vars merged over
  # the selected worker's env for that task type only — reason (low-frequency
  # planning) can run a strong model while explore (high-frequency execution)
  # runs a cheap one, without duplicating worker entries. The worker stays the
  # scheduling unit; every phase (healthcheck/execute/conclude/metering) of
  # the task type sees the overridden env. NOTE: restart to change.
  # task_env_overrides:
  #   reason:
  #     ANTHROPIC_MODEL: "opus"
  #   explore:
  #     ANTHROPIC_MODEL: "haiku"
  # P2 HA standby (active-standby hot spare). false = disabled (legacy: the
  # machine-level fcntl lock permits exactly one dispatcher process). When
  # true you may start a SECOND dispatcher process against the same server:
  # a server-side active lease (dispatcher_lease row) decides which instance
  # dispatches; the other waits as standby. If the active process dies its
  # lease expires after ha_takeover_after seconds and the standby is promoted
  # automatically — process-level HA without a scheduler rewrite. NOTE: the
  # lock bypass only lifts for the dispatcher; the server stays single
  # instance. Restart to change.
  # ha_standby: false
  # Lease TTL: how long after the active dispatcher's last heartbeat a standby
  # may take over. 15s ≈ 5 ticks at interval=3s (network blips don't trigger a
  # false takeover).
  # ha_takeover_after: 15

tasks:
  bootstrap:
    # Main execution timeout for the initial direct solve attempt.
    # Raised 300->400: initial recon (asset discovery + credential-path mapping)
    # needs more time; too short a budget caused premature conclude.
    timeout: 400
    # Time budget for conclude fallback after the main phase times out or returns unusable output.
    # Raised 90->180: the fallback must re-read a large graph plus the whole session and
    # emit a full JSON conclusion. In a real run (4 explores in parallel) two fallbacks
    # were killed at exactly 90s (exit 124, empty stdout) -- and a killed conclude
    # discards the entire round, since the conclusion is the only channel that carries
    # it back into the graph. Better to pay a longer budget than to lose a 5-7 min round.
    conclude_timeout: 180
    # P0-3 conclude retry. false = disabled (legacy behavior: a conclude that times
    # out or returns unparseable JSON discards the whole round even though the
    # session is still alive in the container). When true, a failed conclude is
    # retried once on the SAME session before giving up -- costs at most one extra
    # conclude_timeout instead of losing a 5-7 min round. NOTE: read once at
    # dispatcher start; changing it requires restarting the dispatcher.
    conclude_retry: false
  reason:
    # Reason decides whether the goal is met and whether new intents should be proposed.
    timeout: 300
    # Hard cap on how many new intents one reason step may create.
    # Increased from 2 to 4: logic-vuln testing needs more parallel exploration directions
    # (IDOR, vertical escalation, flow bypass, credential acquisition can all run concurrently).
    max_intents: 4
  explore:
    # Main execution timeout for exploring a claimed intent.
    timeout: 300
    # Time budget for conclude fallback used to summarize confirmed findings from the same session.
    # Raised 90->180 for the same reason as bootstrap above (observed exit-124 kills at 90s).
    conclude_timeout: 180
    # P0-3 conclude retry (same semantics as bootstrap.conclude_retry above).
    conclude_retry: false

container:
  # Base worker container. The dispatcher execs agent commands inside one container per project.
  image: "sharp-worker:latest"
  # "bridge" is the cross-platform default and reaches internet targets on
  # Linux/macOS/Windows. Switch to "host" ONLY on native Linux when you need to
  # scan localhost or the host's own network (on macOS/Windows Docker Desktop
  # "host" binds the Linux VM, not your machine, so it does not do what you want).
  network_mode: "bridge"
  # "stop" keeps finished containers for inspection; "remove" is cleaner but loses post-run state.
  completed_action: "stop"
  # Add Linux capabilities only when a task truly needs them, such as packet crafting or network admin actions.
  # cap_add:
  #   - "NET_RAW"
  #   - "NET_ADMIN"
  # Resource caps (optional). Prevent runaway scanning tools from exhausting host resources.
  # memory: "4g"      # Docker mem_limit string; e.g. "512m", "2g", "4g"
  # cpu_count: 2      # Fractional CPUs to allocate per container; e.g. 1, 1.5, 2


workers:
  # Anthropic / Claude Code worker
  - name: "claude_worker"
    type: "claudecode"
    task_types: [bootstrap, reason, explore]
    max_running: 3
    priority: 0
    env:
      # Model and endpoint should be explicit. Defaults here point at the OFFICIAL Anthropic
      # endpoint with a version-agnostic model alias. If you use a third-party gateway, override
      # with SHARP_BASE_URL / SHARP_MODEL — do not bake someone else's gateway into the default
      # (traffic through an unaffiliated proxy is a supply-chain risk, and it breaks for everyone
      # who does not have an account there).
      ANTHROPIC_MODEL: "${SHARP_MODEL:-sonnet}"
      ANTHROPIC_BASE_URL: "${SHARP_BASE_URL:-https://api.anthropic.com}"
      ANTHROPIC_AUTH_TOKEN: "${SHARP_ANTHROPIC_AUTH_TOKEN:-}"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      CLAUDE_CODE_ATTRIBUTION_HEADER: "0"

  # OpenAI / Codex worker
  - name: "openai_worker"
    type: "codex"
    task_types: [bootstrap, reason, explore]
    max_running: 2
    priority: 1
    env:
      CODEX_MODEL: "${OPENAI_MODEL:-gpt-4}"
      CODEX_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

  # Inflection / Pi worker (disabled - requires 'pi' CLI tool in container)
  # - name: "pi_worker"
  #   type: "pi"
  #   task_types: [bootstrap, reason, explore]
  #   max_running: 2
  #   priority: 2
  #   env:
  #     PI_MODEL: "${PI_MODEL:-inflection-3}"
  #     PI_BASE_URL: "${PI_BASE_URL:-https://api.inflection.ai}"
  #     PI_API_KEY: "${PI_API_KEY:-}"
  #     PI_PROVIDER_API: "inflection"

mcp_servers: []
