<div x-show="view === 'list'" x-cloak class="flex-1 flex flex-col overflow-hidden">
  <header class="bg-white/80 backdrop-blur border-b border-slate-200/60 px-4 py-2.5 flex items-center gap-3 shrink-0">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="h-8 w-8 rounded-lg border border-slate-200 bg-white shadow-sm shadow-slate-200/40 flex items-center justify-center shrink-0 overflow-hidden">
        <img src="/static/favicon.svg" alt="" class="w-5 h-5 block">
      </div>
      <span class="font-semibold text-slate-700 tracking-tight">Sharp 自动化渗透</span>
    </div>
    <div class="flex-1"></div>
    <div class="flex items-center gap-3 text-[11px] text-slate-400">
      <span class="inline-flex items-center gap-1.5 shrink-0" title="全部项目">
        <span class="font-medium uppercase tracking-[0.12em] text-slate-400">全部</span>
        <span class="font-semibold text-slate-600 tabular-nums" x-text="projects.length"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" title="运行中项目">
        <span class="h-1.5 w-1.5 rounded-full bg-teal-500"></span>
        <span class="font-semibold text-teal-700 tabular-nums" x-text="countProjectsByStatus('active')"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" title="已暂停项目">
        <span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>
        <span class="font-semibold text-amber-700 tabular-nums" x-text="countProjectsByStatus('stopped')"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" title="已完成项目">
        <span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>
        <span class="font-semibold text-slate-600 tabular-nums" x-text="countProjectsByStatus('completed')"></span>
      </span>
      <button type="button"
        @click="stopAllActiveProjects()"
        :disabled="!hasActiveProjects() || isStoppingAllProjects"
        class="h-7 px-2.5 rounded-lg border border-amber-200 text-xs text-amber-700 hover:bg-amber-50 transition inline-flex items-center gap-1.5 shrink-0 disabled:cursor-not-allowed disabled:opacity-40"
        title="暂停全部运行中项目">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        <span x-text="isStoppingAllProjects ? '暂停中...' : '暂停全部'"></span>
      </button>
    </div>
    <div class="flex items-center gap-1.5 ml-1">
      <button @click="showLocalPrefs = true" class="h-7 max-w-40 px-2.5 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition inline-flex items-center shrink-0">
        <span class="truncate block" x-text="actorName()"></span>
      </button>
    </div>
  </header>

  <div x-ref="projectListScroll" @scroll.passive="rememberProjectListScroll()" class="flex-1 overflow-y-auto p-4">
    <!-- 资产中心（批次 11.4）：同一目标（host / AppID / 包名）的多条战线聚合成组，点 chip 过滤下方项目 -->
    <div class="mb-3 rounded-2xl border border-slate-200/70 bg-white/70 backdrop-blur px-3 py-2.5">
      <div class="flex items-center gap-2.5">
        <button @click="toggleAssetsPanel()"
          class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-brand-600 transition">
          <svg class="w-3.5 h-3.5" :class="assetsPanelOpen ? 'rotate-90' : ''" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
          <span>资产中心</span>
          <span class="text-[10px] font-medium text-slate-400 normal-case tabular-nums" x-text="assetsLoaded ? assets.length + ' 组' : ''"></span>
        </button>
        <span class="text-[10px] text-slate-400 hidden md:inline">同目标（域名 / AppID / 包名）的多条战线自动聚合</span>
        <div class="flex-1"></div>
        <button x-show="projectAssetFilter" @click="openAssetSpace()"
          class="h-6 px-2 rounded-lg border border-brand-200 bg-brand-50/60 text-[10px] text-brand-600 hover:bg-brand-50 inline-flex items-center gap-1">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6l5 5v13a2 2 0 0 1-2 2Z"/></svg>
          空间详情
        </button>
        <button x-show="projectAssetFilter" @click="projectAssetFilter = ''"
          class="h-6 px-2 rounded-lg border border-slate-200 text-[10px] text-slate-500 hover:bg-slate-50 inline-flex items-center gap-1">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          清除资产筛选
        </button>
      </div>
      <div x-show="assetsPanelOpen" x-cloak class="mt-2.5 flex flex-wrap gap-1.5">
        <template x-if="assetsLoading">
          <span class="px-2.5 py-1 rounded-lg bg-slate-50 text-[11px] text-slate-400">加载中…</span>
        </template>
        <template x-for="g in assets" :key="g.asset_ref + '|' + g.target_kind">
          <button @click="projectAssetFilter = projectAssetFilter === g.asset_ref ? '' : g.asset_ref"
            class="px-2.5 py-1 rounded-lg border text-[11px] transition inline-flex items-center gap-1.5 max-w-full"
            :class="projectAssetFilter === g.asset_ref ? 'border-brand-300 bg-brand-50 text-brand-600' : 'border-slate-200 bg-white text-slate-500 hover:bg-slate-50'">
            <span class="shrink-0 px-1 py-0.5 rounded text-[9px] font-bold uppercase tracking-wide"
              :class="assetKindBadge(g.target_kind).cls" x-text="assetKindBadge(g.target_kind).label"></span>
            <span class="font-mono font-semibold truncate max-w-52" :title="g.asset_ref || '未归类'" x-text="g.asset_ref || '未归类'"></span>
            <span class="text-slate-300 shrink-0">·</span>
            <span class="shrink-0 tabular-nums" x-text="g.project_count + ' 项目'"></span>
            <span x-show="g.vuln_high_total > 0" class="shrink-0 text-rose-500 font-semibold tabular-nums" x-text="'⚠ ' + g.vuln_high_total"></span>
            <span x-show="g.endpoint_total > 0" class="shrink-0 text-slate-400 tabular-nums" x-text="'· 接口 ' + g.endpoint_total + (g.endpoint_todo > 0 ? '/' + g.endpoint_todo + ' 待测' : '')" title="已登记接口数 / 待验证数"></span>
          </button>
        </template>
      </div>
    </div>
    <div class="mb-4 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
      <div class="min-w-0">
        <h1 class="text-lg font-semibold text-slate-800">项目列表</h1>
        <p class="mt-0.5 text-sm text-slate-500">管理 Web、小程序、App 渗透测试任务，跟踪 AI 分析进度</p>
      </div>
      <div class="flex w-full gap-2 lg:w-auto">
        <div class="relative min-w-0 flex-1 lg:w-80">
          <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input x-model.trim="projectSearch" placeholder="搜索项目名称、ID 或状态" class="h-9 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-sm text-slate-600 outline-none transition placeholder:text-slate-300 focus:border-brand-300 focus:ring-2 focus:ring-brand-100">
        </div>
        <select x-model="projectStatusFilter" class="h-9 rounded-xl border border-slate-200 bg-white px-3 text-sm text-slate-600 outline-none transition focus:border-brand-300 focus:ring-2 focus:ring-brand-100">
          <option value="all">全部状态</option>
          <option value="active">运行中</option>
          <option value="stopped">已暂停</option>
          <option value="completed">已完成</option>
        </select>
        <!-- 星标/分组过滤 -->
        <div class="flex items-center gap-1">
          <button type="button" @click="projectStarFilter = 'all'"
            class="h-9 px-3 rounded-xl border text-sm transition"
            :class="projectStarFilter === 'all' ? 'border-brand-300 bg-brand-50 text-brand-600' : 'border-slate-200 bg-white text-slate-500 hover:bg-slate-50'">
            全部
          </button>
          <button type="button" @click="projectStarFilter = 'starred'"
            class="h-9 px-3 rounded-xl border text-sm transition flex items-center gap-1"
            :class="projectStarFilter === 'starred' ? 'border-amber-300 bg-amber-50 text-amber-600' : 'border-slate-200 bg-white text-slate-400 hover:bg-amber-50/50 hover:text-amber-500'">
            <svg class="w-3.5 h-3.5" :fill="projectStarFilter==='starred'?'currentColor':'none'" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <span x-show="starredCount() > 0" x-text="starredCount()"></span>
          </button>
          <template x-for="tag in allProjectTagOptions()" :key="tag">
            <button type="button" @click="projectStarFilter = projectStarFilter === tag ? 'all' : tag"
              class="h-9 px-2.5 rounded-xl border text-[11px] transition"
              :class="projectStarFilter === tag ? 'border-brand-300 bg-brand-50 text-brand-600' : 'border-slate-200 bg-white text-slate-500 hover:bg-slate-50'"
              x-text="tag">
            </button>
          </template>
        </div>
      </div>
    </div>
    <template x-if="projects.length === 0">
      <div class="flex flex-col items-center justify-center h-full text-center px-6 select-none">
        <div class="w-20 h-20 rounded-2xl border-2 border-dashed border-slate-200 flex items-center justify-center mb-5">
          <svg class="w-9 h-9 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.4" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <p class="text-base font-semibold text-slate-600 mb-1">还没有渗透测试项目</p>
        <p class="text-sm text-slate-400 max-w-xs">新建项目后，AI 会从起点目标开始自动探索，发现的过程与结果都会记录在证据图里</p>
        <button @click="goNewProject()"
          class="mt-5 inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-brand-500 text-white text-sm font-semibold hover:bg-brand-600 transition shadow-sm shadow-brand-200">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          新建第一个项目
        </button>
      </div>
    </template>
    <template x-if="projects.length > 0 && filteredProjects().length === 0">
      <div class="rounded-2xl border border-dashed border-slate-200 bg-white px-5 py-12 text-center text-slate-400">
        <p class="text-sm">没有匹配的项目</p>
        <button type="button" @click="projectSearch = ''; projectStatusFilter = 'all'; projectStarFilter = 'all'" class="mt-3 rounded-lg border border-slate-200 px-3 py-1.5 text-xs text-slate-500 hover:bg-slate-50">清空筛选</button>
      </div>
    </template>

    <!-- 项目列表：行式（每条一“条”：状态点 + 标题 + 信号 + 操作，替代卡片墙） -->
    <div class="space-y-2">
      <template x-for="p in filteredProjects()" :key="p.id">
        <div @click="openProject(p.id)"
          class="group rounded-xl border border-slate-200/70 border-l-4 bg-white pl-4 pr-2.5 py-2 cursor-pointer transition hover:shadow-md hover:shadow-slate-200/40"
          :class="{
            'border-l-teal-400 hover:border-l-teal-500': p.status === 'active',
            'border-l-emerald-400': p.status === 'completed',
            'border-l-amber-400': p.status === 'stopped',
            'border-l-slate-200': !['active','completed','stopped'].includes(p.status),
          }">
          <div class="flex flex-wrap items-center gap-x-2.5 gap-y-1.5">
            <!-- 左：运行点 -->
            <span class="h-2 w-2 rounded-full shrink-0"
              :class="p.status === 'active' ? 'bg-teal-500' : p.status === 'stopped' ? 'bg-amber-400' : 'bg-slate-300'"
              :title="statusLabel(p.status)"></span>
            <span class="hidden md:inline text-[10px] font-mono text-slate-400 tracking-wide shrink-0 w-20 truncate" x-text="p.id"></span>
            <!-- 类型徽章 -->
            <template x-if="p.target_kind && p.target_kind !== 'web'">
              <span class="shrink-0 px-1.5 py-0.5 rounded-md text-[9px] font-bold uppercase tracking-wide"
                :class="assetKindBadge(p.target_kind).cls" x-text="assetKindBadge(p.target_kind).label"></span>
            </template>
            <!-- 标题（主行） -->
            <h3 class="min-w-52 flex-1 text-[13.5px] font-semibold text-slate-700 truncate group-hover:text-brand-600 transition-colors" x-text="p.title"></h3>
            <!-- 右：hover 操作（图标化） -->
            <div class="flex items-center gap-0.5 opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition shrink-0">
              <button type="button" @click.stop="toggleStar(p.id)" :title="isStarred(p.id) ? '取消收藏' : '收藏'"
                class="inline-flex h-7 w-7 items-center justify-center rounded-lg border transition"
                :class="isStarred(p.id) ? 'border-amber-300 bg-amber-50 text-amber-500' : 'border-slate-200 text-slate-300 hover:border-amber-200 hover:text-amber-400'">
                <svg class="h-3.5 w-3.5" :fill="isStarred(p.id) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              </button>
              <button type="button" @click.stop="openRenameProject(p.id, p.title)" title="重命名"
                class="inline-flex h-7 w-7 items-center justify-center rounded-lg border border-slate-200 text-slate-400 hover:border-slate-300 hover:bg-slate-50 hover:text-slate-600 transition">
                <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m16.862 4.487 1.65-1.65a1.875 1.875 0 1 1 2.652 2.652l-9.193 9.193a4.5 4.5 0 0 1-1.897 1.13L6 17l1.188-4.074a4.5 4.5 0 0 1 1.13-1.897l8.544-8.542Z"/><path d="M19.5 7.125 16.875 4.5"/><path d="M5.25 18.75h13.5"/></svg>
              </button>
              <button type="button" @click.stop="viewProjectYaml(p.id, p.title)" title="YAML 快照"
                class="inline-flex h-7 w-7 items-center justify-center rounded-lg border border-slate-200 text-slate-400 hover:bg-slate-50 hover:text-slate-600 transition">
                <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M14.25 3H7.5A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h9a2.25 2.25 0 0 0 2.25-2.25V8.25L14.25 3Z"/><path d="M14.25 3v5.25h4.5"/><path d="M8.25 12h7.5M8.25 15h5.25"/></svg>
              </button>
              <template x-if="p.engineered_report_status !== 'done'">
                <button type="button" @click.stop="handleAiReportById(p.id, p.title, p.status)"
                  :disabled="!projectCanCreateAiReport(p.status) || reportDraftingProjectId === p.id"
                  :title="reportDraftingProjectId === p.id ? '报告生成中' : '生成 AI 报告'"
                  class="inline-flex h-7 w-7 items-center justify-center rounded-lg border border-slate-200 text-slate-400 hover:bg-cyan-50 hover:text-cyan-600 transition disabled:opacity-40">
                  <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 3v3"/><path d="M18.364 5.636 16.95 7.05"/><path d="M21 12h-3"/><path d="m18.364 18.364-1.414-1.414"/><path d="M12 21v-3"/><path d="m7.05 16.95-1.414 1.414"/><path d="M6 12H3"/><path d="M7.05 7.05 5.636 5.636"/><circle cx="12" cy="12" r="3.5"/></svg>
                </button>
              </template>
              <template x-if="p.status === 'active'">
                <button type="button" @click.stop="toggleProjectStopById(p.id, p.status)" title="暂停项目"
                  class="inline-flex h-7 w-7 items-center justify-center rounded-lg border border-slate-200 text-slate-400 hover:bg-amber-50 hover:text-amber-600 transition">
                  <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                </button>
                <button type="button" @click.stop="toggleProjectPause(p.id)" :title="p.paused ? '恢复调度' : '暂停调度'"
                  class="inline-flex h-7 w-7 items-center justify-center rounded-lg border transition"
                  :class="p.paused ? 'border-violet-200 text-violet-500 hover:bg-violet-50' : 'border-slate-200 text-slate-400 hover:bg-violet-50 hover:text-violet-500'">
                  <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="10"/></svg>
                </button>
              </template>
              <template x-if="p.status === 'stopped'">
                <button type="button" @click.stop="toggleProjectStopById(p.id, p.status)" title="恢复项目"
                  class="inline-flex h-7 w-7 items-center justify-center rounded-lg border border-slate-200 text-slate-400 hover:bg-teal-50 hover:text-teal-600 transition">
                  <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg>
                </button>
              </template>
              <template x-if="p.status === 'completed'">
                <button type="button" @click.stop="openReopenProject(p.id, p.title)" title="重新打开"
                  class="inline-flex h-7 w-7 items-center justify-center rounded-lg border border-slate-200 text-slate-400 hover:bg-sky-50 hover:text-sky-600 transition">
                  <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.708"/><path d="M3 3v6h6"/></svg>
                </button>
              </template>
              <button type="button" @click.stop="deleteProjectById(p.id, p.title)" title="删除项目"
                class="inline-flex h-7 w-7 items-center justify-center rounded-lg border border-slate-200 text-slate-300 hover:border-rose-200 hover:bg-rose-50 hover:text-rose-500 transition">
                <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4.75A1.75 1.75 0 0 1 9.75 3h4.5A1.75 1.75 0 0 1 16 4.75V6"/><path d="M19 6l-.63 11.338A2 2 0 0 1 16.37 19.5H7.63a2 2 0 0 1-1.997-2.162L5 6"/><path d="M10 10.5v5"/><path d="M14 10.5v5"/></svg>
              </button>
            </div>
            <!-- 第二行：运行信号 / 风险 / 计数 / 状态与时间 -->
            <div class="w-full flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] text-slate-400">
              <span class="shrink-0 font-semibold uppercase tracking-[0.12em]"
                :class="projectStatusBadgeClass(p.status)" x-text="statusLabel(p.status)"></span>
              <template x-if="p.paused">
                <span class="inline-flex items-center rounded-full bg-violet-50 px-2 py-0.5 text-[10px] font-semibold text-violet-600">调度暂停</span>
              </template>
              <template x-if="p.reason">
                <span class="inline-flex items-center gap-1 rounded-full border border-sky-200 bg-sky-50 px-2 py-0.5 text-[10px] font-medium text-sky-700 reason-chip-running" x-text="reasonBadgeText(p.reason, true)"></span>
              </template>
              <template x-if="p.working_intent_count > 0">
                <span class="inline-flex items-center gap-1 rounded-full border border-amber-200 bg-amber-50 px-2 py-0.5 text-[10px] font-medium text-amber-700 intent-chip-running" x-text="workingIntentBadgeText(p.working_intent_count)"></span>
              </template>
              <template x-if="p.engineered_report_status === 'generating'">
                <span class="inline-flex items-center gap-1 rounded-full border border-violet-200 bg-violet-50 px-2 py-0.5 text-[10px] font-medium text-violet-700">
                  <svg class="h-2.5 w-2.5 animate-spin" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v3"/><path d="M18.364 5.636 16.95 7.05"/><path d="M21 12h-3"/><path d="m18.364 18.364-1.414-1.414"/><path d="M12 21v-3"/><path d="m7.05 16.95-1.414 1.414"/><path d="M6 12H3"/><path d="M7.05 7.05 5.636 5.636"/></svg>
                  AI 报告生成中
                </span>
              </template>
              <template x-if="p.engineered_report_status === 'done'">
                <span class="inline-flex items-center gap-1 rounded-full border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[10px] font-medium text-emerald-700">AI 报告已就绪</span>
              </template>
              <template x-for="tag in projectTagList(p.id)" :key="tag">
                <span class="inline-flex items-center gap-1 rounded-full border border-brand-100 bg-brand-50 px-2 py-0.5 text-[10px] font-medium text-brand-600 group/tag">
                  <span x-text="tag"></span>
                  <button type="button" @click.stop="removeProjectTag(p.id, tag)" class="opacity-0 group-hover/tag:opacity-100 transition text-brand-400 hover:text-brand-700 leading-none">×</button>
                </span>
              </template>
              <button type="button" @click.stop="promptDialog({ title: '添加项目标签', placeholder: '如：客户A / 2026Q3', onOk: (t) => { const v = (t || '').trim(); if (v) addProjectTag(p.id, v); } })"
                class="inline-flex items-center gap-0.5 rounded-full border border-dashed border-slate-200 px-1.5 py-0.5 text-[10px] text-slate-300 hover:border-brand-300 hover:text-brand-400 transition">
                <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                标签
              </button>
              <span x-show="p.vuln_high_count > 0" class="ml-auto inline-flex items-center gap-1 text-[11px] text-rose-500 font-semibold tabular-nums shrink-0" x-text="'高危 ⚠ ' + p.vuln_high_count"></span>
              <span class="inline-flex items-center gap-1 shrink-0 tabular-nums" x-text="'证据 ' + p.fact_count"></span>
              <span class="inline-flex items-center gap-1 shrink-0 tabular-nums" x-text="'行动 ' + p.intent_count"></span>
              <template x-if="p.working_intent_count > 0">
                <span class="inline-flex items-center gap-1 shrink-0 tabular-nums text-amber-500" x-text="'运行 ' + p.working_intent_count"></span>
              </template>
              <template x-if="p.unclaimed_intent_count > 0">
                <span class="inline-flex items-center gap-1 shrink-0 tabular-nums" x-text="'待认领 ' + p.unclaimed_intent_count"></span>
              </template>
              <span class="inline-flex items-center gap-1 shrink-0 text-slate-300" x-text="formatDate(p.created_at)"></span>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
