<div x-show="view === 'reports'" x-cloak class="flex-1 flex flex-col overflow-hidden">
  <header class="bg-white/80 backdrop-blur border-b border-slate-200/60 px-4 py-2.5 flex items-center gap-3 shrink-0">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="h-8 w-8 rounded-lg border border-slate-200 bg-white shadow-sm shadow-slate-200/40 flex items-center justify-center shrink-0">
        <svg class="w-5 h-5 text-brand-600" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
          <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2z"/>
        </svg>
      </div>
      <span class="font-semibold text-slate-700 tracking-tight">报告中心</span>
    </div>
    <div class="flex-1"></div>
    <span class="text-xs text-slate-400" x-text="projects.length + ' 个项目'"></span>
  </header>
  <div class="flex-1 overflow-y-auto p-5">
    <div class="max-w-7xl mx-auto">
      <template x-if="projects.length === 0">
        <div class="rounded-2xl border border-slate-200/60 bg-white p-12 text-center text-slate-400">
          <svg class="mx-auto h-10 w-10 opacity-40 mb-3" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2z"/>
          </svg>
          <p class="text-sm">暂无项目，请先创建并完成渗透测试任务</p>
        </div>
      </template>
      <template x-if="projects.length > 0">
        <div class="rounded-2xl border border-slate-200/60 bg-white overflow-hidden">
          <div class="px-5 py-3 border-b border-slate-100 bg-slate-50/50">
            <span class="text-xs font-medium text-slate-500">所有项目 · 点击「生成报告」触发 AI 撰写，完成后可下载导出</span>
          </div>
          <div class="divide-y divide-slate-100">
            <template x-for="p in [...projects].sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')))" :key="p.id">
              <div class="flex flex-wrap items-center gap-3 px-5 py-3.5">
                <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] font-semibold uppercase tracking-[0.12em] shrink-0"
                  :class="projectStatusBadgeClass(p.status)">
                  <span class="h-1.5 w-1.5 rounded-full shrink-0" :class="projectStatusDotClass(p.status)"></span>
                  <span x-text="statusLabel(p.status)"></span>
                </span>
                <div class="flex-1 min-w-[120px]">
                  <span class="text-sm font-medium text-slate-700" x-text="p.title || p.id"></span>
                  <span class="ml-2 font-mono text-[11px] text-slate-400" x-text="p.id"></span>
                </div>
                <span class="text-[11px] text-slate-400 tabular-nums hidden sm:block shrink-0" x-text="formatDate(p.created_at)"></span>
                <span x-show="p.engineered_report_status === 'generating'"
                  class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-amber-50 text-amber-600 border border-amber-200 shrink-0">
                  <span class="h-1.5 w-1.5 rounded-full bg-amber-500 animate-pulse"></span>生成中
                </span>
                <span x-show="p.engineered_report_status === 'done'"
                  class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-50 text-emerald-600 border border-emerald-200 shrink-0">
                  <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>已就绪
                </span>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button @click="handleAiReportById(p.id, p.title, p.status)"
                    :disabled="!projectCanCreateAiReport(p.status) || reportDraftingProjectId === p.id"
                    class="px-2.5 py-1 rounded-lg border border-cyan-200 text-xs text-cyan-600 hover:bg-cyan-50 transition disabled:opacity-30 disabled:cursor-not-allowed"
                    x-text="reportDraftingProjectId === p.id ? '处理中...' : (p.engineered_report_status === 'done' ? '重新生成' : '生成报告')">
                  </button>
                  <button @click="previewAiReport(p.id, p.title)"
                    :disabled="p.engineered_report_status !== 'done'"
                    class="px-2.5 py-1 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 transition disabled:opacity-30 disabled:cursor-not-allowed">
                    预览
                  </button>
                  <button @click="downloadAiReport(p.id, p.title)"
                    :disabled="p.engineered_report_status !== 'done'"
                    class="px-2.5 py-1 rounded-lg border border-emerald-200 text-xs text-emerald-600 hover:bg-emerald-50 transition disabled:opacity-30 disabled:cursor-not-allowed">
                    下载
                  </button>
                  <button @click="openProject(p.id)"
                    class="px-2.5 py-1 rounded-lg border border-slate-200 text-xs text-slate-400 hover:bg-slate-50 hover:text-slate-600 transition">
                    查看
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
